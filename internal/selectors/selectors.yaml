# FlareSolverr Challenge Detection Patterns
# This file contains patterns used to detect various Cloudflare challenge types.
# Patterns are matched case-insensitively against page HTML.

# Access denied patterns - must also contain "cloudflare" to match
access_denied:
  - "access denied"
  - "error 1015"
  - "error 1012"
  - "error 1020"
  - "you have been blocked"

# Turnstile challenge patterns
turnstile:
  - "cf-turnstile"
  - "challenges.cloudflare.com/turnstile"
  - "turnstile-wrapper"

# JavaScript challenge patterns
javascript:
  - "just a moment"
  - "checking your browser"
  - "please wait"
  - "ddos-guard"
  - "__cf_chl_opt"
  - "_cf_chl_opt"
  - "cf-challenge"
  - "cf_chl_prog"

# CAPTCHA patterns (hCaptcha, reCAPTCHA)
# These are detected but not auto-solved
captcha:
  - "hcaptcha.com"
  - "h-captcha"
  - "hcaptcha-checkbox"
  - "recaptcha"
  - "grecaptcha"
  - "g-recaptcha"
  - "recaptcha/api"

# Turnstile checkbox selectors (in order of preference)
# Note: More specific selectors first, generic checkbox last to avoid false positives
turnstile_selectors:
  - ".cf-turnstile-response"
  - "#cf-turnstile-response"
  - "[data-testid='cf-turnstile-response']"
  - "[data-sitekey] input[type='checkbox']"
  - ".cf-turnstile input[type='checkbox']"

# Turnstile frame URL pattern
turnstile_frame_pattern: "challenges.cloudflare.com"

# Shadow DOM host selectors (for closed shadow root traversal)
# These are elements that may contain a shadow root with the Turnstile checkbox
# Modern selectors for Cloudflare Turnstile (2024+)
shadow_hosts:
  - "div:has(> input[name='cf-turnstile-response'])"
  - "div.cf-turnstile-wrapper"
  - ".cf-turnstile"
  - "#turnstile-wrapper"
  - "[data-sitekey]"
  - ".turnstile-container"
  - "[data-cf-turnstile]"
  - "cf-turnstile"
  - "[data-ray]"
  - ".cf-challenge-container"
  - "#challenge-stage"
  - "[data-cf-beacon]"
  - "#cf-challenge-running"

# Selectors to find checkbox inside shadow roots
# More specific Turnstile/CF selectors first, then generic checkbox selectors
shadow_inner_selectors:
  - "[data-testid='cf-turnstile-response'] input"
  - ".cf-turnstile-response"
  - "#turnstile-response"
  - "[aria-label*='Verify'] input[type='checkbox']"
  - "[role='checkbox'][aria-checked]"
  - "label[for*='cf'] input[type='checkbox']"
  - "input[type='checkbox'][id*='cf']"
  - "input[type='checkbox'][name*='cf']"
  - "[role='checkbox']"
  - ".checkbox"
  - "#checkbox"
  - "[aria-checked]"
  - "label input[type='checkbox']"
  - "input[type='checkbox']"

# Page titles that mean a challenge is still in progress.
# Matched case-insensitively as substrings of the page title.
challenge_titles:
  - "just a moment"
  - "checking your browser"
  - "ddos-guard"
  - "please wait"
  - "attention required"

# CSS selectors that mean a challenge is still in progress.
# Checked in order; the first one present is reported.
challenge_selectors:
  - "#cf-challenge-running"
  - ".ray_id"
  - "#turnstile-wrapper"
  - ".cf-turnstile"
  - "#cf-wrapper"
  - "#challenge-running"
  - "#challenge-stage"
  - "#cf-spinner-please-wait"
  - "#cf-spinner-redirecting"
  - "iframe[src*='challenges.cloudflare.com']"

# The challenge selectors that should start Turnstile solving. Broader than the
# widget itself: it includes interstitial pages that embed Turnstile in an iframe.
turnstile_trigger_selectors:
  - "#turnstile-wrapper"
  - ".cf-turnstile"
  - "iframe[src*='challenges.cloudflare.com']"
  - "#cf-challenge-running"
  - "#challenge-stage"

# Selectors for the Turnstile widget on the page. While any of them is present
# the widget is still there. The first is the widget element whose state
# (success class, response token) is inspected.
turnstile_widget_selectors:
  - ".cf-turnstile"
  - "#turnstile-wrapper"

# Elements to click when clicking the widget directly, in order of preference.
# The iframe comes first: it is the most likely to contain the checkbox.
turnstile_click_selectors:
  - ".cf-turnstile iframe"
  - "[data-sitekey] iframe"
  - ".cf-turnstile"
  - "[data-sitekey]"

# Containers whose position is used for a positional click when no shadow host
# gives one.
turnstile_container_selectors:
  - "#turnstile-wrapper"
  - ".cf-turnstile"
  - "[data-sitekey]"

# The hidden input Turnstile writes its token to. Its parent holds the widget.
turnstile_landmark_selector: "input[name='cf-turnstile-response']"
