name: Release

# One workflow per tag: tests gate both the GitHub release and the Docker image.
# (The image build used to live in docker.yml and ran without waiting for tests.)
on:
  push:
    tags:
      - 'v*.*.*'

# Least privilege by default; each job below widens only what it needs.
permissions:
  contents: read

env:
  REGISTRY: docker.io
  IMAGE_NAME: rorqualx/flaresolverr-go

# Third-party actions are pinned to a full commit SHA (the tag is in the
# trailing comment). Dependabot keeps both in step; see .github/dependabot.yml.
jobs:
  test:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: write # create the GitHub release and upload its assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Build and Push
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # latest=auto moves :latest only for a full release. A pre-release
          # tag (v1.2.3-rc.1) gets its own version tag and nothing else.
          flavor: |
            latest=auto
          # No bare major tag while the project is 0.x: "0" promises nothing.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          # Build provenance attestation, attached to the image index. The
          # action already produced one by default; this states the level.
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Signatures, attestations and SBOMs for the release assets. This runs after
  # the release is published and is allowed to fail: it only ever adds files,
  # so a problem here can never block or damage a release.
  supply-chain:
    name: Sign and attest release assets
    runs-on: ubuntu-latest
    needs: [release]
    continue-on-error: true
    permissions:
      contents: write     # upload the signature bundle and SBOMs to the release
      id-token: write     # keyless signing identity (Sigstore) for cosign and attestations
      attestations: write # store the build provenance attestation
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Download release assets
        run: |
          mkdir -p dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern '*.tar.gz' --pattern '*.zip' --pattern 'checksums.txt'

      - name: Verify assets against checksums
        working-directory: dist
        run: sha256sum --check checksums.txt

      - name: Attest build provenance of the release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign checksums (keyless)
        working-directory: dist
        run: cosign sign-blob --yes --bundle checksums.txt.sigstore.json checksums.txt

      - name: Install syft
        id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Generate SBOMs for the archives
        working-directory: dist
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          for archive in *.tar.gz *.zip; do
            "$SYFT" scan "file:${archive}" --output "spdx-json=${archive}.sbom.json"
          done

      - name: Upload signature bundle and SBOMs
        working-directory: dist
        run: gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber checksums.txt.sigstore.json ./*.sbom.json
