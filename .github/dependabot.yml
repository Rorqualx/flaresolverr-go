# Keeps the pinned versions moving. GitHub Actions are pinned to commit SHAs in
# the workflows; Dependabot updates the SHA and the version comment together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: docker
    ignore:
      # The base image decides the Chromium version, which decides the browser
      # fingerprint. It is bumped by hand after a probe run (see the Dockerfile).
      - dependency-name: alpine
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
