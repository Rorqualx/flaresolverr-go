version: '3.8'

services:
  flaresolverr:
    build:
      context: .
      args:
        VERSION: "${VERSION:-dev}"
    image: flaresolverr:latest
    container_name: flaresolverr
    ports:
      - "8191:8191"
    environment:
      # Server
      - HOST=0.0.0.0
      - PORT=8191

      # Browser pool
      - HEADLESS=true
      - BROWSER_POOL_SIZE=1
      - BROWSER_POOL_TIMEOUT=30s
      - MAX_MEMORY_MB=1024

      # Sessions
      - SESSION_TTL=10m
      - SESSION_CLEANUP_INTERVAL=1m
      - MAX_SESSIONS=20

      # Timeouts
      - DEFAULT_TIMEOUT=60s
      - MAX_TIMEOUT=300s

      # Logging
      - LOG_LEVEL=info
      - LOG_HTML=false

      # Security
      - RATE_LIMIT_ENABLED=true
      - RATE_LIMIT_RPM=60

      # Proxy (optional)
      # - PROXY_URL=http://proxy:8080
      # - PROXY_USERNAME=
      # - PROXY_PASSWORD=

    restart: unless-stopped

    # Resource limits for memory efficiency
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

    # Security options
    security_opt:
      - no-new-privileges:true

    # The container needs no Linux capabilities: it runs as a non-root user and
    # Chromium runs with --no-sandbox by default. (BROWSER_SANDBOX=true needs
    # more than this file grants; see "Chromium sandbox" in the README.)
    cap_drop:
      - ALL

    # NOTE: Do NOT mount a tmpfs at /tmp or /tmp/rod (GitHub issue #10).
    # tmpfs defaults to noexec, which breaks Chromium launch, and a nested
    # tmpfs at /tmp/rod breaks Chrome's process-singleton lock (the failure
    # seen on Unraid). It is also unnecessary: Rod's per-browser user-data
    # dirs under /tmp/rod are now cleaned up after every browser close
    # (issue #6), so they no longer accumulate on disk.
    #
    # If you specifically want browser scratch space in RAM, mount a tmpfs
    # with the exec flag at a path that is NOT nested under /tmp/rod, e.g.:
    #   tmpfs:
    #     - /home/flaresolverr/.cache:exec,size=256M

    healthcheck:
      # 127.0.0.1 (localhost may resolve to ::1 first) and the configured PORT
      test: ["CMD-SHELL", "wget -q -T 5 --spider http://127.0.0.1:$${PORT:-8191}/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

